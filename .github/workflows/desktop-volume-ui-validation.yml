name: Validate desktop volume UI

on:
  push:
    branches: [validation/desktop-volume-ui]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: da3e6555a222ff423c42b2f09e578b1f835268ab
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test test/desktop_volume_control_test.dart
