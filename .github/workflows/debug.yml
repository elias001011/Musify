name: Build debug APK and fork pre-release
on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-debug-

      - name: Read required Flutter version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^  flutter: \^([\d.]+)$', Path('pubspec.yaml').read_text(), re.M).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FLUTTER_VERSION={version}\n')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

      - name: Test YouTube date parsing and search pagination
        working-directory: packages/youtube_explode_dart
        run: |
          dart pub get
          dart test test/relative_date_test.dart

      - name: Build universal debug APK
        run: flutter build apk --debug --flavor github --no-pub

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-github-debug.apk dist/Musify-youtube-debug.apk
          cd dist
          sha256sum Musify-youtube-debug.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Musify-youtube-debug
          path: dist/*
          if-no-files-found: error

      - name: Publish pre-release in this fork
        if: github.repository == 'elias001011/Musify'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="youtube-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF
          Build debug experimental para investigar busca e reprodução do YouTube.

          Base: upstream master 6cd66ec4 (Musify 10.5.3).
          Commit: ${GITHUB_SHA}
          Corrige datas abreviadas como Streamed 3y ago sem derrubar a busca.
          Inclui os ajustes de clientes/cabeçalhos de reprodução do upstream.

          Instala como app separado: com.gokadzev.musify.debug.
          Testar com proxy desligado e copiar os logs se a reprodução falhar.
          A correção da busca foi testada; a reprodução precisa de validação no dispositivo.
          EOF
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "Musify 10.5.3 — YouTube debug" \
            --notes-file release-notes.md \
            --prerelease --latest=false
