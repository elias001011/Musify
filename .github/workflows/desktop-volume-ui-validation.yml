name: Validate desktop volume UI

on:
  push:
    branches: [validation/desktop-volume-ui]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: elias001011/Musify-Desktop-Port
          ref: 6b11e7416e86a39311a8b9d50753be0c7a0d9a4b
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test test/desktop_volume_control_test.dart
